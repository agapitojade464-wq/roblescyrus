<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My 1st project</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <!-- ✅ ADDED: Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css" />
</head> 
<body>
    <div class="container mt-5">
        <div class="text-center mb-4">
            <h1>Login forms</h1>
            <p>Kindly place your credentials here</p>
        </div>

        <div class="mb-3">
            <input type="text" class="form-control" placeholder="Username" />
        </div>

        <!-- ✅ Proper wrapper for password + icon -->
        <div class="password-eye position-relative mb-3">
            <input id="pwd" class="form-control" type="password" placeholder="Password" />
            <i id="togglePwd" class="bi bi-eye-fill position-absolute end-0 top-50 translate-middle-y me-3"></i>
        </div>

        <button onclick="alert('You are successfully logged in')" type="button" class="btn btn-primary w-100">Login</button>
    </div>

    <!-- ✅ Optional: Add working show/hide password functionality -->
    <script>
        const pwdInput = document.getElementById('pwd');
        const toggleIcon = document.getElementById('togglePwd');

        toggleIcon.addEventListener('click', () => {
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleIcon.classList.remove('bi-eye-fill');
                toggleIcon.classList.add('bi-eye-slash-fill');
            } else {
                pwdInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-slash-fill');
                toggleIcon.classList.add('bi-eye-fill');
            }
        });
    </script>
</body>
</html
